<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
        <title>Fluid container</title>
    </head>
    <body>
        <center>
            <div class="container-fluid bg-danger text-warning">
                first
            </div>
            <div class="container-fluid bg-success text-primary">
                second
            </div>
            <div class="container-fluid bg-danger text-info">
                third
            </div>
            <div class="container-fluid bg-light text-secondary">
                forth
            </div>
            <div class="container-fluid bg-dark text-light">
                fifth
            </div>
        </center>
    </body>
</html>
